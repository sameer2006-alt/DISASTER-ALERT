server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: disaster-backend
  config:
    import: "optional:file:.env[.properties]"
  data:
    mongodb:
      auto-index-creation: true
      uri: ${MONGODB_URI:mongodb://localhost:27017/disaster_db}
  mail:
    host: ${MAIL_HOST:smtp.example.org}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${GMAIL_USER:}}
    password: ${MAIL_PASSWORD:${GMAIL_APP_PASSWORD:}}
    brevo-api-key: ${BREVO_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      enabled: false

app:
  mail:
    from: ${MAIL_FROM:${GMAIL_USER:}}
    from-name: Smart Disaster Alert
    provider: ${MAIL_PROVIDER:auto}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  openweather:
    api-key: ${OPENWEATHER_API_KEY:}
  nasa-firms:
    map-key: ${NASA_FIRMS_MAP_KEY:}
  google:
    api-key: ${GOOGLE_API_KEY:}
  gee:
    service-url: ${GEE_SERVICE_URL:http://localhost:5050}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    phone-number: ${TWILIO_PHONE_NUMBER:}
  ingest:
    api-key: ${INGEST_API_KEY:}
  integrations:
    auto-ingest: ${AUTO_INGEST:false}